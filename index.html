<footer class="data-bar">
  <div class="data-row">
    <h2>Data</h2>
    <button type="button" data-collection="categories" disabled>categories.json</button>
    <button type="button" data-collection="tools" disabled>tools.json</button>
    <button type="button" data-collection="practices" disabled>practices.json</button>
    <button type="button" data-collection="usages" disabled>usages.json</button>
    <button type="button" data-restore disabled>Restore initial data</button>
  </div>
  <p id="data-status" class="data-status" role="status"></p>
</footer>
<script>
  // Chrome doesn't scroll a focused link that is already partly visible, so on
  // narrow screens keep the focused oval's ring fully inside the scroll box.
  document.querySelector('.schema').addEventListener('focusin', function (event) {
    var ring = event.target.querySelector && event.target.querySelector('.focus-ring');
    if (!ring) return;
    var r = ring.getBoundingClientRect(), b = this.getBoundingClientRect(), pad = 12;
    if (r.left < b.left + pad) this.scrollLeft -= b.left + pad - r.left;
    else if (r.right > b.right - pad) this.scrollLeft += r.right - (b.right - pad);
  });

  // db.js is deferred, so it runs after this script: wait for it before using DB.
  document.addEventListener('DOMContentLoaded', function () {
    var LOAD_ERROR = 'Could not load the initial data. Open the project through a local server ' +
      '(for example, Live Server or python3 -m http.server).';
    var loadError = document.getElementById('load-error');
    var status = document.getElementById('data-status');
    var buttons = document.querySelectorAll('.data-bar button');

    function setEnabled(enabled) {
      buttons.forEach(function (button) { button.disabled = !enabled; });
    }
    function showLoadError() {
      loadError.textContent = LOAD_ERROR;
    }

    DB.ready.then(function () { setEnabled(true); }, showLoadError);

    document.querySelector('.data-bar').addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button || button.disabled) return;
      status.textContent = '';
      if (button.dataset.collection) {
        DB.download(button.dataset.collection);
        return;
      }
      if (!confirm('Restore the initial data? Changes saved in this browser will be lost.')) return;
      setEnabled(false);
      DB.reset()
        .then(function () {
          loadError.textContent = '';
          status.textContent = 'Initial data restored.';
        }, showLoadError)
        .then(function () { setEnabled(true); });
    });
  });
</script>
